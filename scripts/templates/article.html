<!DOCTYPE html>
$marker
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>$title · it's Leon Tan</title>
    <meta name="description" content="$description">
    <link rel="canonical" href="$canonical">
    <meta property="og:type" content="article">
    <meta property="og:title" content="$title">
    <meta property="og:description" content="$description">
    <meta property="og:url" content="$canonical">
    <meta property="article:published_time" content="$date_iso">
    <link rel="icon" type="image/x-icon" href="../../src/rubik.png">

    <!-- Apply saved / system theme before first paint to avoid a flash -->
    <script>
        (function () {
            var root = document.documentElement;
            var theme;
            try { theme = localStorage.getItem("theme"); } catch (e) {}
            if (theme !== "light" && theme !== "dark") {
                theme = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
            }
            root.classList.remove("light", "dark");
            root.classList.add(theme, "js");
        })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="../../css/main.css">
    <link rel="stylesheet" href="../../css/writing.css">
    <script src="../../js/index.js" defer></script>
</head>

<body>
    <div class="rails" aria-hidden="true"></div>

    <!-- ========== HEADER ========== -->
    <header>
        <div class="header-blur" aria-hidden="true">
            <span></span><span></span><span></span>
        </div>

        <div class="container header-inner">
            <a id="avatar" class="glass" href="../../" aria-label="Leon Tan — home">
                <img src="../../src/headshot.jpg" alt="Leon Tan" width="48" height="48">
            </a>

            <nav class="glass site-nav" aria-label="Main">
                <a href="../../">Home</a>
                <a href="../../reading/">Reading</a>
                <a href="../" class="active">Writing</a>
            </nav>

            <button id="theme-toggle" class="glass" type="button" aria-label="Switch theme">
                <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
                <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
            </button>
        </div>
    </header>

    <!-- ========== MAIN ========== -->
    <main class="container">
        <article class="article">
            <a class="back-link" href="../"><span aria-hidden="true">←</span> All writing</a>

            <div class="article-head ani">
                <p class="post-meta">
                    <time datetime="$date_iso">$date_long</time>
                    <span>$category</span>
                    <span>$reading_time min read</span>
                </p>
                <h1 class="article-title">$title</h1>
                <p class="article-lede">$description</p>
            </div>

            <div class="prose ani">
$content
            </div>

            <div class="article-foot">
                $tags
                $updated
                <a class="back-link" href="../"><span aria-hidden="true">←</span> Back to all writing</a>
            </div>
        </article>
    </main>

    <!-- ========== FOOTER ========== -->
    <footer class="container">
        <div>&#169; 2026 Leon Tan</div>
    </footer>
</body>

</html>
