<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Writing · it's Leon Tan</title>
    <meta name="description" content="Ideas, experiences, experiments, and things Leon Tan has learned along the way.">
    <link rel="icon" type="image/x-icon" href="../src/rubik.png">

    <!-- Apply saved / system theme before first paint to avoid a flash -->
    <script>
        (function () {
            var root = document.documentElement;
            var theme;
            try { theme = localStorage.getItem("theme"); } catch (e) {}
            if (theme !== "light" && theme !== "dark") {
                theme = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
            }
            root.classList.remove("light", "dark");
            root.classList.add(theme, "js");
        })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/writing.css">
    <script src="../js/index.js" defer></script>
    <script src="../js/writing.js" defer></script>
</head>

<body>
    <div class="rails" aria-hidden="true"></div>

    <!-- ========== HEADER ========== -->
    <header>
        <div class="header-blur" aria-hidden="true">
            <span></span><span></span><span></span>
        </div>

        <div class="container header-inner">
            <a id="avatar" class="glass" href="../" aria-label="Leon Tan — home">
                <img src="../src/headshot.jpg" alt="Leon Tan" width="48" height="48">
            </a>

            <nav class="glass site-nav" aria-label="Main">
                <a href="../">Home</a>
                <a href="../reading/">Reading</a>
                <a href="./" class="active" aria-current="page">Writing</a>
            </nav>

            <button id="theme-toggle" class="glass" type="button" aria-label="Switch theme">
                <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
                <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
            </button>
        </div>
    </header>

    <!-- ========== MAIN ========== -->
    <main class="container">

        <!-- INTRO -->
        <section id="writing" class="ani">
            <p class="eyebrow">Writing &middot; My Digital Garden</p>
            <h1 class="page-title">The Living Archive</h1>
            <p>
                A place for sharing experiences, exploring ideas, documenting projects, and writing about the things that catch my interest.
            </p>
        </section>

        <!-- ARTICLES (rendered by js/writing.js from writing/articles.json,
             which scripts/build_writing.py generates from writing/articles/*.md) -->
        <section id="articles" class="articles" aria-label="Articles">
            <div id="filters" class="filters" role="group" aria-label="Filter by category" hidden></div>
            <ul id="post-list" class="posts"></ul>
            <p id="posts-status" class="posts-status" role="status">Loading articles…</p>
            <noscript><p class="posts-status">The article list needs JavaScript to load.</p></noscript>
        </section>
    </main>

    <!-- ========== FOOTER ========== -->
    <footer class="container">
        <div>&#169; 2026 Leon Tan</div>
    </footer>
</body>

</html>
